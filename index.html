<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aheui Editor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h1>아희 실행기</h1>
        <ul>
            <li>요소 1</li>
            <li>요소 2</li>
        </ul>
    </nav>

    <div class="controls">
        <button id="execution" class="execution">실행</button>
        <button id="pause" class="execution">일시정지</button>
        <button id="resume" class="execution">재개</button>
        <button id="reset" class="execution">초기화</button>
        <button id="oneStep" class="execution">한 단계 실행</button>
    </div>

    <div class="utils">
        <input id="speed" type="range" min="0" max="40" value="20">
    </div>
    
    <textarea id="hidden_input"></textarea>

    <div id="container">
        <!-- 에디터 -->
        <div id="editor_container">
            <div id="editor"></div>
        </div>

        <!-- 결과 출력 -->
        <div class="res_container">
            <div id="res_top">출력</div>
            <div id="res_panel"></div>
        </div>

        <!-- 스택 패널 -->
        <div id="stack_panel">여기</div>
    </div>

    <script src="editor.js"></script>
    <script src="interpreter.js"></script>
</body>

</html>
